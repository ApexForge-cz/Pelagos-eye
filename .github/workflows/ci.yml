name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    env:
      OCEANSCOPE_TEST_DATABASE_URL: postgresql+psycopg://oceanscope:oceanscope-ci-test-only@127.0.0.1:5432/oceanscope_test
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: oceanscope_test
          POSTGRES_USER: oceanscope
          POSTGRES_PASSWORD: oceanscope-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oceanscope -d oceanscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install locked dependencies
        run: uv sync --directory apps/api --frozen
      - name: Check formatting
        run: uv run --directory apps/api ruff format --check .
      - name: Lint
        run: uv run --directory apps/api ruff check .
      - name: Type check
        run: uv run --directory apps/api mypy src tests
      - name: Test
        run: uv run --directory apps/api pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm run web:format:check
      - name: Lint
        run: npm run web:lint
      - name: Test
        run: npm run web:test
      - name: Build
        run: npm run web:build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
