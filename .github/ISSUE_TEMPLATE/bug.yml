name: Bug or data-integrity incident
description: Report reproducible incorrect behavior or source-backed data concerns
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: source-context
    attributes:
      label: Source, version, and observation time
      description: Do not include credentials or sensitive payloads.
  - type: textarea
    id: impact
    attributes:
      label: Integrity, cache, publication, or user impact
    validations:
      required: true
