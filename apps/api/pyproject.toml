[project]
name = "oceanscope-api"
version = "0.1.0"
description = "Engineering foundation for the OceanScope API"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "geoalchemy2>=0.18,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
oceanscope-import-earthquakes = "oceanscope_api.earthquakes.cli:main"
oceanscope-import-ports = "oceanscope_api.ports.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oceanscope_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: tests that require an explicitly configured disposable service",
]

[tool.coverage.run]
branch = true
source = ["oceanscope_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
